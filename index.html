<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>管理後台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&family=Noto+Sans+TC:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F7F3EA; --paper-card:#FFFFFF; --ink:#1B3A4B; --ink-soft:#3E5A6B;
    --vermillion:#C1440E; --vermillion-soft:#E9E1D3; --matcha:#6E7F3C;
    --muted:#8A8272; --border:#E4DDCB; --danger:#B3261E;
    --font-display:"Noto Serif TC",serif; --font-body:"Noto Sans TC",sans-serif; --font-mono:"JetBrains Mono",ui-monospace,monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-body);-webkit-font-smoothing:antialiased;}
  .hidden{display:none !important;}
  button{font-family:var(--font-body);cursor:pointer;}
  input,textarea,select{font-family:var(--font-body);}
  h1,h2,h3{font-family:var(--font-display);margin:0 0 6px;}
  .top-bar{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:var(--ink);color:var(--paper);gap:8px;}
  .top-bar .brand{font-family:var(--font-display);font-size:17px;}
  .top-bar .ghost{background:transparent;border:1px solid rgba(247,243,234,.4);color:var(--paper);padding:6px 12px;border-radius:999px;font-size:12.5px;}
  .container{max-width:760px;margin:0 auto;padding:20px 16px 60px;}
  .subtitle{color:var(--muted);font-size:13.5px;margin:0 0 16px;}
  .card{background:var(--paper-card);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:14px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;color:var(--ink-soft);margin-bottom:5px;}
  .field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;background:var(--paper);color:var(--ink);}
  .field textarea{resize:vertical;line-height:1.6;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 18px;border-radius:999px;border:none;font-size:14px;font-weight:600;}
  .btn-accent{background:var(--vermillion);color:#fff;}
  .btn-outline{background:transparent;border:1px solid var(--ink);color:var(--ink);}
  .btn-block{width:100%;}
  .btn:disabled{opacity:.6;}
  .auth-wrap{min-height:80vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .auth-card{max-width:380px;width:100%;background:var(--paper-card);border:1px solid var(--border);border-radius:18px;padding:30px 26px;}
  .message{padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:14px;background:#FBEAE7;color:var(--danger);}
  .message.success{background:#E8EFDD;color:var(--matcha);}

  .nav{display:flex;gap:8px;margin-bottom:18px;}
  .nav-btn{flex:1;border:1px solid var(--border);background:var(--paper-card);color:var(--ink-soft);padding:12px 8px;border-radius:12px;font-size:14px;font-weight:700;}
  .nav-btn.active{background:var(--vermillion);color:#fff;border-color:var(--vermillion);}
  .nav-badge{display:inline-block;min-width:20px;padding:1px 6px;margin-left:6px;border-radius:999px;background:var(--danger);color:#fff;font-size:11px;font-family:var(--font-mono);}
  .nav-btn.active .nav-badge{background:#fff;color:var(--vermillion);}

  .tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
  .tab{border:1px solid var(--border);background:var(--paper-card);color:var(--ink-soft);padding:8px 16px;border-radius:999px;font-size:13px;font-weight:600;}
  .tab.active{background:var(--ink);color:var(--paper);border-color:var(--ink);}
  .tab .count{font-family:var(--font-mono);font-size:11.5px;margin-left:4px;opacity:.8;}
  .add-toggle{width:100%;text-align:left;background:none;border:none;padding:0;font-family:var(--font-display);font-size:17px;font-weight:600;color:var(--ink);display:flex;justify-content:space-between;align-items:center;}
  .report.done{background:#F5F8F0;}
  .report.done .text{color:var(--muted);text-decoration:line-through;}
  .check-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:var(--paper);border:1px solid var(--border);cursor:pointer;user-select:none;margin-bottom:10px;}
  .check-row.checked{background:#E8EFDD;border-color:#C9D8B0;}
  .check-row input{width:22px;height:22px;accent-color:var(--matcha);cursor:pointer;margin:0;flex-shrink:0;}
  .check-row span{font-size:14px;font-weight:600;}
  .report-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px;}
  .type-tag{font-weight:700;font-size:13px;}
  .src-tag{font-size:10.5px;background:var(--vermillion-soft);color:var(--vermillion);padding:2px 8px;border-radius:999px;margin-left:6px;}
  .text{font-size:14px;line-height:1.7;white-space:pre-wrap;word-break:break-word;margin:8px 0;}
  .shot{max-width:100%;max-height:260px;border-radius:10px;border:1px solid var(--border);cursor:zoom-in;display:block;margin-bottom:10px;}
  .meta{font-size:11.5px;color:var(--muted);margin-top:3px;word-break:break-all;}
  .note-box{margin-top:12px;padding-top:12px;border-top:1px dashed var(--border);}
  .note-box textarea,.edit-box textarea{width:100%;min-height:64px;padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:13.5px;background:var(--paper);color:var(--ink);resize:vertical;line-height:1.6;}
  .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:10px;flex-wrap:wrap;}
  .pill{border:none;border-radius:999px;padding:6px 16px;font-size:12px;font-weight:600;}
  .pill-edit{background:#E8EFDD;color:var(--matcha);}
  .pill-del{background:#FBEAE7;color:var(--danger);}
  .pill-save{background:var(--vermillion-soft);color:var(--vermillion);}
  .pill-cancel{background:var(--paper);color:var(--ink-soft);border:1px solid var(--border);}
  .empty{text-align:center;padding:36px 16px;color:var(--muted);font-size:13.5px;}
  .thumb-wrap{position:relative;width:84px;height:84px;margin-top:8px;}
  .thumb-wrap img{width:84px;height:84px;object-fit:cover;border-radius:8px;border:1px solid var(--border);}
  .thumb-wrap button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;background:var(--danger);color:#fff;border:2px solid #fff;font-size:11px;padding:0;}
  .lightbox{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:300;display:flex;align-items:center;justify-content:center;padding:20px;cursor:zoom-out;}
  .lightbox img{max-width:100%;max-height:92vh;border-radius:10px;}

  /* 公告 */
  .live-card{border:2px solid var(--matcha);background:#F5F8F0;}
  .live-badge{display:inline-block;font-size:11px;font-weight:700;background:var(--matcha);color:#fff;padding:2px 10px;border-radius:999px;margin-bottom:8px;}
  .off-badge{display:inline-block;font-size:11px;font-weight:700;background:var(--vermillion-soft);color:var(--muted);padding:2px 10px;border-radius:999px;margin-bottom:8px;}
  .ann-title{font-weight:700;font-size:15px;margin-bottom:6px;}
  .char-count{font-size:11.5px;color:var(--muted);text-align:right;margin-top:3px;font-family:var(--font-mono);}
  .modal-overlay{position:fixed;inset:0;background:rgba(27,58,75,.55);z-index:250;display:flex;align-items:center;justify-content:center;padding:20px;overflow-y:auto;}
  .modal-card{background:var(--paper-card);border-radius:18px;padding:24px;max-width:380px;width:100%;margin:auto;box-shadow:0 10px 40px rgba(27,58,75,.25);}
  .preview-tag{font-size:11px;color:var(--vermillion);font-weight:700;margin-bottom:8px;letter-spacing:.06em;}
  .dont-show{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-soft);margin:14px 0;cursor:pointer;user-select:none;}
  .dont-show input{width:18px;height:18px;accent-color:var(--vermillion);margin:0;}
</style>
</head>
<body>
<div id="topBar" class="top-bar hidden">
  <div class="brand">🛠️ 管理後台</div>
  <button class="ghost" id="logoutBtn">登出</button>
</div>
<div id="root"><div class="empty">載入中…</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-app-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-auth-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-firestore-compat.min.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyAtMm_FyE_wlduD-T-dpGJSJTduoJhhDi4",
  authDomain: "travel-app-d60a2.firebaseapp.com",
  projectId: "travel-app-d60a2",
  storageBucket: "travel-app-d60a2.firebasestorage.app",
  messagingSenderId: "421219269881",
  appId: "1:421219269881:web:64af48d9def28394857628",
  measurementId: "G-QRTP15451X"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

const ADMIN_UID = 'daLnya3P5TPKai8U7tFCrfayYOO2';
const TYPE_LABELS = {bug:'🐞 功能壞掉', ui:'📱 畫面跑版', idea:'💡 功能建議', other:'💬 其他'};
const root = document.getElementById('root');
const topBar = document.getElementById('topBar');

let currentUser = null;
let reports = [];
let announcements = [];
let filter = 'open';
let view = 'bugs';
let unsubBugs = null;
let unsubAnn = null;
let editingIds = new Set();
let newImage = null;

function esc(s){ return (s||'').toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtTime(ts){
  if(!ts || typeof ts.toDate!=='function') return '剛剛';
  return ts.toDate().toLocaleString('zh-TW',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
}
function authError(err){
  const map = {
    'auth/invalid-credential':'email 或密碼錯誤',
    'auth/wrong-password':'密碼錯誤',
    'auth/user-not-found':'找不到這個帳號',
    'auth/invalid-email':'email 格式不正確',
    'auth/too-many-requests':'嘗試太多次了，請稍後再試',
    'auth/network-request-failed':'網路連線失敗'
  };
  return map[err.code] || err.message;
}
function compressImage(file, maxW, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = ev=>{
      const img = new Image();
      img.onerror = reject;
      img.onload = ()=>{
        const scale = Math.min(1, maxW/img.width);
        const c = document.createElement('canvas');
        c.width = img.width*scale; c.height = img.height*scale;
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        resolve(c.toDataURL('image/jpeg', quality));
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });
}
function flash(text, type){
  const box = document.getElementById('flashBox');
  if(!box) return;
  const el = document.createElement('div');
  el.className = 'message ' + (type||'');
  el.textContent = text;
  box.prepend(el);
  setTimeout(()=>el.remove(), 3500);
}

document.getElementById('logoutBtn').onclick = ()=>auth.signOut();

auth.onAuthStateChanged(user=>{
  currentUser = user;
  if(unsubBugs){ unsubBugs(); unsubBugs = null; }
  if(unsubAnn){ unsubAnn(); unsubAnn = null; }
  if(!user){
    topBar.classList.add('hidden');
    renderLogin();
    return;
  }
  topBar.classList.remove('hidden');
  if(user.uid !== ADMIN_UID){
    root.innerHTML = `<div class="container"><div class="card"><h2>沒有權限</h2><p class="subtitle" style="margin:0;">目前登入的帳號（${esc(user.email)}）不是管理員。請登出後改用管理員帳號。</p></div></div>`;
    return;
  }
  if(!user.emailVerified){
    root.innerHTML = `<div class="container"><div class="card"><h2>Email 尚未驗證</h2><p class="subtitle" style="margin:0;">請先到主 App 完成 Email 驗證。</p></div></div>`;
    return;
  }
  renderShell();
  startListening();
});

function renderLogin(){
  root.innerHTML = `
    <div class="auth-wrap"><div class="auth-card">
      <h1 style="text-align:center;font-size:22px;">管理後台</h1>
      <p class="subtitle" style="text-align:center;">請用管理員帳號登入</p>
      <div id="msgBox"></div>
      <form id="loginForm">
        <div class="field"><label>Email</label><input type="email" id="email" required></div>
        <div class="field"><label>密碼</label><input type="password" id="password" required></div>
        <button type="submit" class="btn btn-accent btn-block">登入</button>
      </form>
    </div></div>`;
  document.getElementById('loginForm').onsubmit = async (e)=>{
    e.preventDefault();
    const btn = e.target.querySelector('button');
    btn.disabled = true; btn.textContent = '登入中…';
    try{
      await auth.signInWithEmailAndPassword(
        document.getElementById('email').value.trim(),
        document.getElementById('password').value
      );
    }catch(err){
      document.getElementById('msgBox').innerHTML = `<div class="message">${esc(authError(err))}</div>`;
      btn.disabled = false; btn.textContent = '登入';
    }
  };
}

// 外殼只畫一次：兩個分頁都先畫好、用顯示/隱藏切換，輸入到一半的內容不會因為切頁或即時更新而消失
function renderShell(){
  newImage = null;
  root.innerHTML = `
    <div class="container">
      <div id="flashBox"></div>
      <div class="nav">
        <button class="nav-btn" data-view="bugs">🐞 Bug 回報<span class="nav-badge hidden" id="bugBadge">0</span></button>
        <button class="nav-btn" data-view="ann">📢 發布公告</button>
      </div>

      <!-- ============ Bug 回報頁 ============ -->
      <div id="viewBugs">
        <div class="card">
          <button class="add-toggle" id="addToggle"><span>✏️ 新增 Bug 敘述</span><span id="addIcon">▶</span></button>
          <div id="addBody" class="hidden" style="margin-top:14px;">
            <form id="addForm">
              <div class="field">
                <label>類型</label>
                <select id="newType">
                  <option value="bug">🐞 功能壞掉</option>
                  <option value="ui">📱 畫面跑版</option>
                  <option value="idea">💡 功能建議</option>
                  <option value="other">💬 其他</option>
                </select>
              </div>
              <div class="field">
                <label>Bug 敘述</label>
                <textarea id="newText" rows="5" maxlength="2000" placeholder="寫下這個 bug 的情況、怎麼重現。也可以直接 Ctrl+V 貼上截圖" required></textarea>
              </div>
              <div class="field">
                <label class="btn btn-outline" style="display:inline-flex;padding:8px 16px;font-size:13px;">📷 附上截圖（選填）<input type="file" id="newImageInput" accept="image/*" style="display:none"></label>
                <div id="newImagePreview"></div>
              </div>
              <button type="submit" class="btn btn-accent btn-block">儲存到 Firebase</button>
            </form>
          </div>
        </div>
        <div id="listArea"><div class="empty">載入回報中…</div></div>
      </div>

      <!-- ============ 公告頁 ============ -->
      <div id="viewAnn" class="hidden">
        <div class="card">
          <h2>📢 發布新公告</h2>
          <p class="subtitle" style="margin-bottom:14px;">發布後，使用者下次打開旅遊網頁就會跳出這則公告。每次發布都算「新公告」，即使使用者之前勾過「不再顯示」，也會再跳出一次。</p>
          <form id="annForm">
            <div class="field">
              <label>標題（選填）</label>
              <input type="text" id="annTitle" maxlength="40" placeholder="例如：新功能上線囉！">
            </div>
            <div class="field">
              <label>公告內容</label>
              <textarea id="annBody" rows="7" maxlength="1000" placeholder="寫下要告訴大家的事情，可以換行" required></textarea>
              <div class="char-count"><span id="annCount">0</span> / 1000</div>
            </div>
            <div style="display:flex;gap:8px;flex-wrap:wrap;">
              <button type="button" class="btn btn-outline" id="annPreviewBtn" style="flex:0 0 auto;">👁️ 預覽</button>
              <button type="submit" class="btn btn-accent" style="flex:1;min-width:140px;">發布公告</button>
            </div>
          </form>
        </div>
        <div id="annArea"><div class="empty">載入公告中…</div></div>
      </div>
    </div>`;

  // 分頁切換
  root.querySelectorAll('[data-view]').forEach(b=>b.onclick = ()=>{ view = b.dataset.view; applyView(); });
  applyView();

  // ---- Bug 新增表單 ----
  document.getElementById('addToggle').onclick = ()=>{
    const body = document.getElementById('addBody');
    const hidden = body.classList.toggle('hidden');
    document.getElementById('addIcon').textContent = hidden ? '▶' : '▼';
  };
  const preview = document.getElementById('newImagePreview');
  function renderPreview(){
    preview.innerHTML = newImage ? `<div class="thumb-wrap"><img src="${newImage}"><button type="button" id="newImageRemove">✕</button></div>` : '';
    const rm = document.getElementById('newImageRemove');
    if(rm) rm.onclick = ()=>{ newImage = null; renderPreview(); };
  }
  document.getElementById('newImageInput').onchange = async (e)=>{
    const f = e.target.files[0]; e.target.value = '';
    if(f){ newImage = await compressImage(f, 1000, 0.7); renderPreview(); }
  };
  document.getElementById('newText').addEventListener('paste', async (e)=>{
    const item = [...(e.clipboardData ? e.clipboardData.items : [])].find(it=>it.type && it.type.startsWith('image/'));
    if(!item) return;
    e.preventDefault();
    const f = item.getAsFile();
    if(f){ newImage = await compressImage(f, 1000, 0.7); renderPreview(); }
  });
  document.getElementById('addForm').onsubmit = async (e)=>{
    e.preventDefault();
    const text = document.getElementById('newText').value.trim();
    if(!text){ flash('請輸入 bug 敘述'); return; }
    const btn = e.target.querySelector('button[type="submit"]');
    btn.disabled = true; btn.textContent = '儲存中…';
    try{
      const data = {
        type: document.getElementById('newType').value,
        text,
        uid: currentUser.uid,
        email: currentUser.email || '',
        displayName: '管理員（手動新增）',
        tripId: '',
        tripName: '',
        userAgent: navigator.userAgent,
        screen: `${window.innerWidth}x${window.innerHeight}`,
        source: 'admin',
        status: 'open',
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      };
      if(newImage) data.image = newImage;
      await db.collection('bugReports').add(data);
      e.target.reset();
      newImage = null; renderPreview();
      flash('已儲存到 Firebase ✓', 'success');
      filter = 'open';
    }catch(err){
      flash('儲存失敗：' + err.message);
    }finally{
      btn.disabled = false; btn.textContent = '儲存到 Firebase';
    }
  };

  // ---- 公告表單 ----
  const annBodyEl = document.getElementById('annBody');
  annBodyEl.oninput = ()=>{ document.getElementById('annCount').textContent = annBodyEl.value.length; };
  document.getElementById('annPreviewBtn').onclick = ()=>{
    const body = annBodyEl.value.trim();
    if(!body){ flash('請先輸入公告內容'); return; }
    openPreview(document.getElementById('annTitle').value.trim(), body);
  };
  document.getElementById('annForm').onsubmit = async (e)=>{
    e.preventDefault();
    const title = document.getElementById('annTitle').value.trim();
    const body = annBodyEl.value.trim();
    if(!body){ flash('請輸入公告內容'); return; }
    if(!confirm('確定要發布這則公告嗎？所有使用者下次打開旅遊網頁都會看到。')) return;
    const btn = e.target.querySelector('button[type="submit"]');
    btn.disabled = true; btn.textContent = '發布中…';
    try{
      await db.collection('announcements').add({
        title, body,
        active: true,
        authorUid: currentUser.uid,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      e.target.reset();
      document.getElementById('annCount').textContent = '0';
      flash('公告已發布 ✓ 使用者下次打開網頁就會看到', 'success');
    }catch(err){
      flash('發布失敗：' + err.message);
    }finally{
      btn.disabled = false; btn.textContent = '發布公告';
    }
  };
}

function applyView(){
  document.getElementById('viewBugs').classList.toggle('hidden', view!=='bugs');
  document.getElementById('viewAnn').classList.toggle('hidden', view!=='ann');
  root.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active', b.dataset.view===view));
}

function startListening(){
  // 即時監聽：有新回報或在別的裝置改了狀態，這裡會自動更新
  unsubBugs = db.collection('bugReports').orderBy('createdAt','desc').onSnapshot(
    snap=>{
      reports = snap.docs.map(d=>({id:d.id, ...d.data()}));
      renderList();
    },
    err=>{
      const area = document.getElementById('listArea');
      if(area) area.innerHTML = `<div class="card"><h2>載入失敗</h2><p class="subtitle" style="margin:0;">${esc(err.message)}<br>請確認 Firestore 規則已更新為「管理員可讀取 bugReports」。</p></div>`;
    }
  );
  unsubAnn = db.collection('announcements').orderBy('createdAt','desc').limit(50).onSnapshot(
    snap=>{
      announcements = snap.docs.map(d=>({id:d.id, ...d.data()}));
      renderAnnouncements();
    },
    err=>{
      const area = document.getElementById('annArea');
      if(area) area.innerHTML = `<div class="card"><h2>公告載入失敗</h2><p class="subtitle" style="margin:0;">${esc(err.message)}<br>請確認 Firestore 規則已加入 announcements 的規則。</p></div>`;
    }
  );
}

// ============ Bug 列表 ============
function renderList(){
  const area = document.getElementById('listArea');
  if(!area) return;

  // 保留正在輸入中的內容，避免即時更新時被洗掉
  const drafts = {};
  area.querySelectorAll('[data-note-input]').forEach(t=>{ drafts['note:'+t.dataset.noteInput] = t.value; });
  area.querySelectorAll('[data-edit-input]').forEach(t=>{ drafts['edit:'+t.dataset.editInput] = t.value; });

  const openCount = reports.filter(r=>r.status!=='done').length;
  const doneCount = reports.length - openCount;

  const badge = document.getElementById('bugBadge');
  if(badge){
    badge.textContent = openCount;
    badge.classList.toggle('hidden', openCount===0);
  }

  const list = reports.filter(r=>{
    if(filter==='open') return r.status!=='done';
    if(filter==='done') return r.status==='done';
    return true;
  });

  area.innerHTML = `
    <p class="subtitle">還沒修 ${openCount} 筆・已修好 ${doneCount} 筆</p>
    <div class="tabs">
      <button class="tab ${filter==='open'?'active':''}" data-filter="open">還沒修<span class="count">${openCount}</span></button>
      <button class="tab ${filter==='done'?'active':''}" data-filter="done">已修好<span class="count">${doneCount}</span></button>
      <button class="tab ${filter==='all'?'active':''}" data-filter="all">全部<span class="count">${reports.length}</span></button>
    </div>
    ${list.length===0 ? `<div class="empty">${filter==='open'?'沒有還沒修的 bug 🎉':'這裡還沒有回報'}</div>` : list.map(r=>{
      const isDone = r.status==='done';
      const isEditing = editingIds.has(r.id);
      const note = drafts['note:'+r.id] !== undefined ? drafts['note:'+r.id] : (r.resolutionNote||'');
      const editVal = drafts['edit:'+r.id] !== undefined ? drafts['edit:'+r.id] : (r.text||'');
      return `
      <div class="card report ${isDone?'done':''}">
        <label class="check-row ${isDone?'checked':''}">
          <input type="checkbox" data-check="${r.id}" ${isDone?'checked':''}>
          <span>${isDone?'✓ 已修好':'打勾代表已修好'}</span>
        </label>
        <div class="report-top">
          <span class="type-tag">${TYPE_LABELS[r.type]||esc(r.type||'')}${r.source==='admin'?'<span class="src-tag">手動新增</span>':''}</span>
        </div>
        ${isEditing ? `
          <div class="edit-box">
            <textarea data-edit-input="${r.id}" maxlength="2000">${esc(editVal)}</textarea>
            <div class="actions">
              <button class="pill pill-cancel" data-edit-cancel="${r.id}">取消</button>
              <button class="pill pill-save" data-edit-save="${r.id}">儲存敘述</button>
            </div>
          </div>
        ` : `<div class="text">${esc(r.text||'（沒有文字）')}</div>`}
        ${r.image ? `<img class="shot" src="${r.image}" data-zoom title="點擊放大">` : ''}
        <div class="meta">👤 ${esc(r.displayName||'')}${r.email?`（${esc(r.email)}）`:''}</div>
        <div class="meta">${r.tripName?`🧳 ${esc(r.tripName)}　`:''}🕒 ${fmtTime(r.createdAt)}${isDone && r.resolvedAt ? `　✅ 修好於 ${fmtTime(r.resolvedAt)}` : ''}</div>
        <div class="meta">📟 ${esc(r.screen||'')}　${esc(r.userAgent||'')}</div>
        <div class="note-box">
          <textarea data-note-input="${r.id}" placeholder="修復備註（選填，例如：已在 v1.3 修正）">${esc(note)}</textarea>
          <div class="actions">
            <button class="pill pill-save" data-save-note="${r.id}">儲存備註</button>
            ${isEditing ? '' : `<button class="pill pill-edit" data-edit="${r.id}">編輯敘述</button>`}
            <button class="pill pill-del" data-del="${r.id}">刪除</button>
          </div>
        </div>
      </div>`;
    }).join('')}`;

  area.querySelectorAll('[data-filter]').forEach(b=>b.onclick = ()=>{ filter = b.dataset.filter; renderList(); });
  area.querySelectorAll('[data-zoom]').forEach(img=>img.onclick = ()=>{
    const box = document.createElement('div');
    box.className = 'lightbox';
    box.innerHTML = `<img src="${img.src}">`;
    box.onclick = ()=>box.remove();
    document.body.appendChild(box);
  });

  // 打勾 = 已修好
  area.querySelectorAll('[data-check]').forEach(cb=>cb.onchange = async ()=>{
    const id = cb.dataset.check;
    const noteEl = area.querySelector(`[data-note-input="${id}"]`);
    const markDone = cb.checked;
    const data = {
      status: markDone ? 'done' : 'open',
      resolvedAt: markDone ? firebase.firestore.FieldValue.serverTimestamp() : firebase.firestore.FieldValue.delete()
    };
    if(noteEl) data.resolutionNote = noteEl.value.trim();
    cb.disabled = true;
    try{ await db.collection('bugReports').doc(id).update(data); }
    catch(err){ alert('更新失敗：'+err.message); cb.checked = !markDone; cb.disabled = false; }
  });

  area.querySelectorAll('[data-save-note]').forEach(btn=>btn.onclick = async ()=>{
    const id = btn.dataset.saveNote;
    const noteEl = area.querySelector(`[data-note-input="${id}"]`);
    btn.disabled = true;
    try{
      await db.collection('bugReports').doc(id).update({ resolutionNote: noteEl.value.trim() });
      btn.textContent = '已儲存 ✓';
      setTimeout(()=>{ if(document.body.contains(btn)){ btn.textContent='儲存備註'; btn.disabled=false; } }, 1200);
    }catch(err){ alert('儲存失敗：'+err.message); btn.disabled = false; }
  });

  area.querySelectorAll('[data-edit]').forEach(btn=>btn.onclick = ()=>{ editingIds.add(btn.dataset.edit); renderList(); });
  area.querySelectorAll('[data-edit-cancel]').forEach(btn=>btn.onclick = ()=>{ editingIds.delete(btn.dataset.editCancel); renderList(); });
  area.querySelectorAll('[data-edit-save]').forEach(btn=>btn.onclick = async ()=>{
    const id = btn.dataset.editSave;
    const text = area.querySelector(`[data-edit-input="${id}"]`).value.trim();
    if(!text){ alert('敘述不能是空的'); return; }
    btn.disabled = true;
    try{
      await db.collection('bugReports').doc(id).update({ text });
      editingIds.delete(id);
    }catch(err){ alert('儲存失敗：'+err.message); btn.disabled = false; }
  });

  area.querySelectorAll('[data-del]').forEach(btn=>btn.onclick = async ()=>{
    if(!confirm('確定要刪除這筆回報嗎？無法復原。')) return;
    try{ await db.collection('bugReports').doc(btn.dataset.del).delete(); }
    catch(err){ alert('刪除失敗：'+err.message); }
  });
}

// ============ 公告列表 ============
// 旅遊網頁只會顯示「最新發布的一則」，而且它必須是上架狀態。
// 所以：列表第一筆如果是上架中 → 就是目前線上公告；其餘都是歷史紀錄。
function renderAnnouncements(){
  const area = document.getElementById('annArea');
  if(!area) return;

  const latest = announcements[0];
  const liveNow = latest && latest.active !== false ? latest : null;
  const history = announcements.filter(a=>!liveNow || a.id !== liveNow.id);

  area.innerHTML = `
    ${liveNow ? `
      <div class="card live-card">
        <span class="live-badge">● 目前線上顯示中</span>
        ${liveNow.title ? `<div class="ann-title">${esc(liveNow.title)}</div>` : ''}
        <div class="text">${esc(liveNow.body)}</div>
        <div class="meta">🕒 發布於 ${fmtTime(liveNow.createdAt)}</div>
        <div class="actions">
          <button class="pill pill-cancel" data-ann-preview="${liveNow.id}">預覽</button>
          <button class="pill pill-save" data-ann-off="${liveNow.id}">撤下公告</button>
          <button class="pill pill-del" data-ann-del="${liveNow.id}">刪除</button>
        </div>
      </div>
    ` : `
      <div class="card" style="background:var(--paper);">
        <span class="off-badge">目前沒有公告顯示中</span>
        <p class="subtitle" style="margin:0;">使用者打開旅遊網頁不會看到任何公告。</p>
      </div>
    `}
    <h3 style="margin:18px 0 10px;font-size:15px;">歷史公告（${history.length}）</h3>
    ${history.length===0 ? `<div class="empty">還沒有其他歷史公告</div>` : history.map(a=>`
      <div class="card">
        <span class="off-badge">${a.active===false?'已撤下':'歷史'}</span>
        ${a.title ? `<div class="ann-title">${esc(a.title)}</div>` : ''}
        <div class="text">${esc(a.body)}</div>
        <div class="meta">🕒 ${fmtTime(a.createdAt)}</div>
        <div class="actions">
          <button class="pill pill-cancel" data-ann-preview="${a.id}">預覽</button>
          <button class="pill pill-edit" data-ann-reuse="${a.id}">帶入表單再發布</button>
          <button class="pill pill-del" data-ann-del="${a.id}">刪除</button>
        </div>
      </div>
    `).join('')}
  `;

  area.querySelectorAll('[data-ann-preview]').forEach(btn=>btn.onclick = ()=>{
    const a = announcements.find(x=>x.id===btn.dataset.annPreview);
    if(a) openPreview(a.title, a.body);
  });
  area.querySelectorAll('[data-ann-off]').forEach(btn=>btn.onclick = async ()=>{
    if(!confirm('確定要撤下這則公告嗎？撤下後使用者不會再看到。')) return;
    btn.disabled = true;
    try{ await db.collection('announcements').doc(btn.dataset.annOff).update({ active:false }); }
    catch(err){ alert('撤下失敗：'+err.message); btn.disabled = false; }
  });
  area.querySelectorAll('[data-ann-del]').forEach(btn=>btn.onclick = async ()=>{
    if(!confirm('確定要刪除這則公告嗎？無法復原。')) return;
    try{ await db.collection('announcements').doc(btn.dataset.annDel).delete(); }
    catch(err){ alert('刪除失敗：'+err.message); }
  });
  area.querySelectorAll('[data-ann-reuse]').forEach(btn=>btn.onclick = ()=>{
    const a = announcements.find(x=>x.id===btn.dataset.annReuse);
    if(!a) return;
    document.getElementById('annTitle').value = a.title || '';
    const bodyEl = document.getElementById('annBody');
    bodyEl.value = a.body || '';
    document.getElementById('annCount').textContent = bodyEl.value.length;
    window.scrollTo({top:0, behavior:'smooth'});
    flash('已帶入表單，修改後按「發布公告」就會當成新公告發布', 'success');
  });
}

// 預覽：跟使用者在旅遊網頁看到的彈窗長一樣
function openPreview(title, body){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal-card">
      <div class="preview-tag">👁️ 預覽（使用者看到的樣子）</div>
      <h3 style="font-size:19px;margin-bottom:10px;">📢 ${esc(title || '公告')}</h3>
      <div style="white-space:pre-wrap;font-size:14px;line-height:1.8;color:var(--ink-soft);max-height:50vh;overflow-y:auto;padding-bottom:6px;word-break:break-word;">${esc(body)}</div>
      <label class="dont-show"><input type="checkbox"> 不再顯示這則公告</label>
      <button class="btn btn-accent btn-block" id="previewCloseBtn">確認</button>
    </div>`;
  document.body.appendChild(overlay);
  overlay.querySelector('#previewCloseBtn').onclick = ()=>overlay.remove();
  overlay.onclick = (ev)=>{ if(ev.target===overlay) overlay.remove(); };
}
</script>
